<!DOCTYPE html>
<html>
<head>
  <title>Zombie Arena 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a0d0a; font-family: Arial; }
    #hud { position: absolute; top: 10px; left: 10px; color: white; z-index: 1000; text-shadow: 2px 2px black; pointer-events: none; }
    #stats { margin-top: 10px; font-size: 18px; }
    #hpbar { width: 200px; height: 15px; border: 2px solid white; margin-top: 5px; background: rgba(0,0,0,0.5); }
    #hp { width: 100%; height: 100%; background: #ff3333; transition: width 0.2s; }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 2000; }
    #death-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(139, 0, 0, 0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; cursor: pointer; }
    #death-screen h1 { font-size: 100px; margin-bottom: 20px; text-shadow: 5px 5px black; }
    #death-screen p { font-size: 24px; }
    #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 15px; z-index: 2500; cursor: pointer; border: 2px solid #555; }
  </style>
</head>
<body>

<div id="hud">
  ❤️ Health
  <div id="hpbar"><div id="hp"></div></div>
  <div id="stats">
    💀 Kills: <span id="kills">0</span><br>
    🌊 Wave: <span id="wave">1</span><br>
    🏆 Best: <span id="highscore">0</span>
  </div>
</div>

<div id="crosshair"></div>

<div id="instructions">
  <h1>ZOMBIE ARENA 3D</h1>
  <p>WASD to Move | Mouse to Look | Click to Shoot | Q to Aim</p>
  <p><b>Click to Start</b></p>
</div>

<div id="death-screen" onclick="location.reload()">
  <h1>YOU DIED</h1>
  <p id="death-stats"></p>
  <p>Click anywhere to restart</p>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* GAME STATE */
let health = 8;
let score = 0;
let wave = 1;
let highscore = localStorage.getItem("zombieHighScore") || 0;
document.getElementById("highscore").innerText = highscore;

const keys = {};
let isMouseDown = false;
let lastShotTime = 0;
const fireRate = 150; 
let zombies = [];
let bots = [];
let walls = [];
let isGameOver = false;

/* THREE.JS SETUP */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0d0a);
scene.fog = new THREE.FogExp2(0x1a0d0a, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
const instructions = document.getElementById('instructions');

instructions.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => instructions.style.display = 'none');
controls.addEventListener('unlock', () => { if (!isGameOver) instructions.style.display = 'block'; });

/* LIGHTING */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const flashLight = new THREE.SpotLight(0xffffff, 10, 100, Math.PI/6, 0.5);
flashLight.position.set(0, 0, 0);
camera.add(flashLight);
camera.add(flashLight.target);
flashLight.target.position.set(0, 0, -1);
scene.add(camera);

/* EMOJI TEXTURES */
function createEmojiTexture(emoji) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '100px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

const zombieTexture = createEmojiTexture('🧟');
const botTexture = createEmojiTexture('🤠');

/* BRICK TEXTURE */
function createBrickTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 64, 32);
  ctx.fillStyle = '#994433'; ctx.fillRect(2, 2, 60, 28);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}
const brickBaseTexture = createBrickTexture();

/* WORLD ELEMENTS */
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(2000, 100, 0xff0000, 0xaa5500);
grid.position.y = 0.05;
scene.add(grid);

function createWall(x, z, w, d, h = 4) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const tex = brickBaseTexture.clone();
  tex.repeat.set(Math.max(w, d), h);
  const mat = new THREE.MeshStandardMaterial({ map: tex });
  const wall = new THREE.Mesh(geo, mat);
  wall.position.set(x, h/2, z);
  scene.add(wall);
  const collider = new THREE.Box3().setFromObject(wall);
  walls.push(collider);
}

// Layout
createWall(20, 0, 2, 10); createWall(-20, 0, 2, 10);
createWall(0, 20, 10, 2); createWall(0, -20, 10, 2);
createWall(100, 0, 10, 200); createWall(-100, 0, 10, 200);
createWall(0, 100, 200, 10); createWall(0, -100, 200, 10);

/* PISTOL MODEL */
const pistolGroup = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 });
const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), gunMat);
barrel.position.z = -0.2;
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), gunMat);
grip.position.set(0, -0.15, -0.05); grip.rotation.x = -0.2;
pistolGroup.add(barrel, grip);
pistolGroup.position.set(0.4, -0.3, -0.6);
camera.add(pistolGroup);

/* AUDIO SYSTEM */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const duration = 0.3;
  const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < audioCtx.sampleRate * duration; i++) output[i] = Math.random() * 2 - 1;
  const noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
  noiseSource.start();
}

let lastPunchTime = 0;
function playPunchSound() {
  const now = Date.now(); if (now - lastPunchTime < 250) return; lastPunchTime = now;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function speak(text, pitch = 1, rate = 1) {
  const utt = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const male = voices.find(v => v.name.includes("Male") || v.name.includes("David") || v.name.includes("Alex"));
  if (male) utt.voice = male; utt.pitch = pitch; utt.rate = rate;
  window.speechSynthesis.speak(utt);
}

/* ENTITY LOGIC */
function spawnZombie() {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: zombieTexture }));
  const angle = Math.random() * Math.PI * 2; const dist = 50 + Math.random() * 30;
  sprite.position.set(camera.position.x + Math.cos(angle) * dist, 1.2, camera.position.z + Math.sin(angle) * dist);
  sprite.scale.set(2, 2, 1); sprite.hp = 3; sprite.lastHit = 0;
  scene.add(sprite); zombies.push(sprite);
}

function killZombie(z) {
  speak("ow", 0.5, 1.8); scene.remove(z); zombies = zombies.filter(item => item !== z);
  score++; document.getElementById("kills").innerText = score;
  if (score % 10 === 0) { wave++; document.getElementById("wave").innerText = wave; }
  spawnZombie();
}

function spawnBot(x, z) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: botTexture }));
  sprite.position.set(x, 1.2, z); sprite.scale.set(2, 2, 1); sprite.lastShotTime = 0;
  scene.add(sprite); bots.push(sprite);
}

for (let i = 0; i < 15; i++) spawnZombie();
spawnBot(5, 5); spawnBot(-5, -5);

/* INPUT & COMBAT */
window.addEventListener('keydown', (e) => keys[e.code] = true);
window.addEventListener('keyup', (e) => keys[e.code] = false);
window.addEventListener('mousedown', () => isMouseDown = true);
window.addEventListener('mouseup', () => isMouseDown = false);

const raycaster = new THREE.Raycaster();
function shoot() {
  const now = Date.now(); if (now - lastShotTime < fireRate) return; lastShotTime = now;
  playGunshot(); pistolGroup.position.z += 0.1; pistolGroup.rotation.x -= 0.1;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObjects(zombies);
  if (hits.length > 0) { hits[0].object.hp -= 1; if (hits[0].object.hp <= 0) killZombie(hits[0].object); }
}

/* LOOP */
let lastTime = performance.now();
function animate(time) {
  requestAnimationFrame(animate);
  const dt = (time - lastTime) / 16.67; lastTime = time;

  if (controls.isLocked && !isGameOver) {
    // ADS / Zoom
    const targetFOV = keys['KeyQ'] ? 40 : 75;
    const targetGunX = keys['KeyQ'] ? 0 : 0.4;
    camera.fov += (targetFOV - camera.fov) * (1 - Math.pow(0.1, dt/10)); camera.updateProjectionMatrix();
    pistolGroup.position.x += (targetGunX - pistolGroup.position.x) * (1 - Math.pow(0.1, dt/10));
    pistolGroup.position.y += ((keys['KeyQ'] ? -0.2 : -0.3) - pistolGroup.position.y) * (1 - Math.pow(0.1, dt/10));

    if (isMouseDown) shoot();
    pistolGroup.position.z += (-0.6 - pistolGroup.position.z) * 0.2 * dt;
    pistolGroup.rotation.x += (0 - pistolGroup.rotation.x) * 0.2 * dt;

    // Player Move & Collision
    const oldPos = camera.position.clone();
    const moveSpeed = 0.15 * dt;
    if (keys['KeyW']) controls.moveForward(moveSpeed); if (keys['KeyS']) controls.moveForward(-moveSpeed);
    if (keys['KeyA']) controls.moveRight(-moveSpeed); if (keys['KeyD']) controls.moveRight(moveSpeed);
    const pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(0.8, 2, 0.8));
    for (const wall of walls) { if (pBox.intersectsBox(wall)) { camera.position.copy(oldPos); break; } }
    camera.position.y = 1.6;

    // Bots
    bots.forEach(bot => {
      const dist = bot.position.distanceTo(camera.position);
      if (dist > 10) {
        const dir = new THREE.Vector3().subVectors(camera.position, bot.position).normalize();
        bot.position.x += dir.x * 0.1 * dt; bot.position.z += dir.z * 0.1 * dt;
      }
      let nearest = null; let minDist = Infinity;
      zombies.forEach(z => { const d = z.position.distanceTo(bot.position); if (d < minDist) { minDist = d; nearest = z; } });
      if (nearest && minDist < 50 && Date.now() - bot.lastShotTime > 800) {
        bot.lastShotTime = Date.now(); playGunshot();
        nearest.hp -= 1; if (nearest.hp <= 0) killZombie(nearest);
      }
    });

    // Zombies
    zombies.forEach(z => {
      const dist = z.position.distanceTo(camera.position);
      if (dist > 1.5) {
        const dir = new THREE.Vector3().subVectors(camera.position, z.position).normalize();
        z.position.x += dir.x * (0.05 + wave * 0.01) * dt; z.position.z += dir.z * (0.05 + wave * 0.01) * dt;
      }
      if (dist < 2 && Date.now() - z.lastHit > 1000) {
        health -= 1.6; z.lastHit = Date.now(); playPunchSound();
        document.getElementById("hp").style.width = (Math.max(0, health) / 8 * 200) + "px";
        if (health <= 0) {
          isGameOver = true; speak("ahhh!", 0.4, 1.4); controls.unlock();
          document.getElementById("death-stats").innerText = `Kills: ${score} | Wave: ${wave}`;
          document.getElementById("death-screen").style.display = "flex";
          zombies.forEach(zom => scene.remove(zom)); zombies = [];
          if (score > highscore) localStorage.setItem("zombieHighScore", score);
        }
      }
    });
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
