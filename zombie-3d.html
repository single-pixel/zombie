<!DOCTYPE html>
<html>
<head>
  <title>Zombie Arena 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a0d0a; font-family: Arial; }
    #hud { position: absolute; top: 10px; left: 10px; color: white; z-index: 1000; text-shadow: 2px 2px black; pointer-events: none; }
    #stats { margin-top: 10px; font-size: 18px; }
    #hpbar { width: 200px; height: 15px; border: 2px solid white; margin-top: 5px; background: rgba(0,0,0,0.5); }
    #hp { width: 100%; height: 100%; background: #ff3333; transition: width 0.2s; }
    #helper-hud { position: absolute; top: 10px; right: 10px; color: white; z-index: 1000; text-align: right; pointer-events: none; }
    .helper-status { margin-bottom: 5px; font-size: 14px; text-shadow: 1px 1px black; }
    .helper-hp-bg { width: 120px; height: 8px; border: 1px solid white; background: rgba(0,0,0,0.5); display: inline-block; margin-left: 5px; }
    .helper-hp-fill { height: 100%; background: #00ff00; transition: width 0.2s; }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 2000; }
    #sniper-scope {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vmax;
      height: 100vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, transparent 20%, black 21%);
      display: none;
      z-index: 2500;
      pointer-events: none;
    }
    #sniper-scope::before, #sniper-scope::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.5);
    }
    #sniper-scope::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }
    #sniper-scope::after {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    #death-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(139, 0, 0, 0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; cursor: pointer; }
    #death-screen h1 { font-size: 100px; margin-bottom: 20px; text-shadow: 5px 5px black; }
    #death-screen p { font-size: 24px; }
    #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; z-index: 2500; border: 2px solid #555; min-width: 350px; }
    .weapon-selector { margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
    .weapon-btn { background: #333; color: white; border: 2px solid #555; padding: 10px; cursor: pointer; transition: all 0.2s; border-radius: 5px; }
    .weapon-btn:hover { background: #444; border-color: #999; }
    .weapon-btn.selected { border-color: #ff3333; background: #552222; }
    #equip-btn { background: #aa0000; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }
    #equip-btn:hover { background: #cc0000; transform: scale(1.05); }
    #weapon-info { margin-top: 10px; font-size: 14px; color: #aaa; min-height: 20px; }
  </style>
</head>
<body>

<div id="hud">
  ❤️ Health
  <div id="hpbar"><div id="hp"></div></div>
  <div id="stats">
    💀 Kills: <span id="kills">0</span><br>
    🏢 Floor: <span id="floor">1</span> / 5<br>
    🏆 Best: <span id="highscore">0</span><br>
    🔫 Ammo: <span id="ammo">0</span> / <span id="max-ammo">0</span><br>
    💣 Grenades: <span id="grenade-count">3</span>
  </div>
</div>

<div id="helper-hud"></div>

<div id="crosshair"></div>
<div id="sniper-scope"></div>

<div id="flash" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 5000; transition: opacity 0.1s;"></div>

<div id="instructions">
  <h1>ZOMBIE ARENA 3D</h1>
  <p>WASD to Move | Mouse to Look | Click to Shoot | Q to Aim</p>
  
  <div class="weapon-selector">
    <button class="weapon-btn" onclick="selectWeapon('pistol')">Pistol 🔫</button>
    <button class="weapon-btn" onclick="selectWeapon('ar')">Assault Rifle 🔫</button>
    <button class="weapon-btn" onclick="selectWeapon('sniper')">Sniper 🏹</button>
  </div>
  
  <div id="weapon-info">Select a weapon to see stats...</div>
  <button id="equip-btn" onclick="startGame()">EQUIP & START</button>
</div>

<div id="victory-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 128, 0, 0.9); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 4000; cursor: pointer;" onclick="location.reload()">
  <h1>VICTORY!</h1>
  <p>You cleared all 5 floors!</p>
  <p>Click anywhere to play again</p>
</div>

<div id="death-screen" onclick="location.reload()">
  <h1>YOU DIED</h1>
  <p id="death-stats"></p>
  <p>Click anywhere to restart</p>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* GAME STATE */
let health = 8;
let score = 0;
let currentFloor = 1;
let highscore = localStorage.getItem("zombieHighScore") || 0;
document.getElementById("highscore").innerText = highscore;

const keys = {};
let isMouseDown = false;
let lastShotTime = 0;
let lastGrenadeTime = 0;
let grenadeAmmo = 3;
let shakeAmount = 0;
let zombies = [];
let bots = [];
let walls = [];
let wallMeshes = [];
let bloodParticles = [];
let medkits = [];
let grenades = [];
let isGameOver = false;

/* WEAPON SYSTEM */
let currentAmmo = 30;
let isReloading = false;
const weapons = {
  pistol: { name: 'Pistol', fireRate: 350, damage: 2, range: 40, zoom: 65, model: 'pistol', maxAmmo: 12 },
  ar: { name: 'Assault Rifle', fireRate: 120, damage: 1, range: 100, zoom: 55, model: 'ar', maxAmmo: 30 },
  sniper: { name: 'Sniper', fireRate: 1500, damage: 10, range: 500, zoom: 10, model: 'sniper', maxAmmo: 5 }
};
let currentWeapon = weapons.ar;
document.getElementById('ammo').innerText = currentAmmo;
document.getElementById('max-ammo').innerText = weapons.ar.maxAmmo;

window.selectWeapon = function(type) {
  currentWeapon = weapons[type];
  currentAmmo = currentWeapon.maxAmmo;
  document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('selected'));
  event.target.classList.add('selected');
  document.getElementById('weapon-info').innerText = `${currentWeapon.name}: Damage ${currentWeapon.damage} | Ammo: ${currentWeapon.maxAmmo}`;
  document.getElementById('equip-btn').style.display = 'inline-block';
  document.getElementById('ammo').innerText = currentAmmo;
  document.getElementById('max-ammo').innerText = currentWeapon.maxAmmo;
  updatePistolModel();
};

window.startGame = function() {
  controls.lock();
};

/* THREE.JS SETUP */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky Blue

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
const instructions = document.getElementById('instructions');

controls.addEventListener('lock', () => instructions.style.display = 'none');
controls.addEventListener('unlock', () => { if (!isGameOver) instructions.style.display = 'block'; });

/* LIGHTING */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); // Much brighter
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
sunLight.position.set(10, 20, 10);
scene.add(sunLight);

const flashLight = new THREE.SpotLight(0xffffff, 5, 100, Math.PI/6, 0.5); // Dimmer flashlight for day
flashLight.position.set(0, 0, 0);
camera.add(flashLight);
camera.add(flashLight.target);
flashLight.target.position.set(0, 0, -1);
scene.add(camera);

/* DAY/NIGHT CYCLE */
let cycleTimer = 0;
const DAY_TIME = 30000; // 30s
const NIGHT_TIME = 60000; // 60s
const TOTAL_CYCLE = DAY_TIME + NIGHT_TIME;
const nightFog = new THREE.FogExp2(0x1a0d0a, 0.015);

function updateDayNightCycle() {
  cycleTimer = (performance.now() % TOTAL_CYCLE);
  
  if (cycleTimer < DAY_TIME) {
    // Daytime
    scene.background.setHex(0x87ceeb);
    ambientLight.intensity = 0.8;
    sunLight.intensity = 1.0;
    flashLight.intensity = 2;
    scene.fog = null;
  } else {
    // Nighttime
    scene.background.setHex(0x1a0d0a);
    ambientLight.intensity = 0.2;
    sunLight.intensity = 0.1;
    flashLight.intensity = 10;
    scene.fog = nightFog;
  }
}

/* EMOJI TEXTURES */
function createEmojiTexture(emoji) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = '100px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

const zombieTexture = createEmojiTexture('🧟');
const botTexture = createEmojiTexture('🤠');
const medkitTexture = createEmojiTexture('🩹');
const grenadeTexture = createEmojiTexture('💣');

/* BRICK TEXTURE */
function createBrickTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 64, 32);
  ctx.fillStyle = '#994433'; ctx.fillRect(2, 2, 60, 28);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}
const brickBaseTexture = createBrickTexture();

/* WORLD ELEMENTS */
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3e8e41, roughness: 0.8 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(2000, 100, 0x555555, 0x888888);
grid.position.y = 0.05;
scene.add(grid);

function createWall(x, z, w, d, h = 4) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const tex = brickBaseTexture.clone();
  tex.repeat.set(Math.max(w, d), h);
  const mat = new THREE.MeshStandardMaterial({ map: tex });
  const wall = new THREE.Mesh(geo, mat);
  wall.position.set(x, h/2, z);
  scene.add(wall);
  const collider = new THREE.Box3().setFromObject(wall);
  walls.push(collider);
  wallMeshes.push(wall);
}

function clearWalls() {
  wallMeshes.forEach(w => scene.remove(w));
  wallMeshes = [];
  walls = [];
}

function generateFloorLayout(floor) {
  clearWalls();
  // Outer Bounds
  createWall(100, 0, 10, 200); createWall(-100, 0, 10, 200);
  createWall(0, 100, 200, 10); createWall(0, -100, 200, 10);
  
  if (floor === 1) {
    createWall(25, 0, 2, 15); createWall(-25, 0, 2, 15);
    createWall(0, 25, 15, 2); createWall(0, -25, 15, 2);
  } else if (floor === 2) {
    createWall(35, 35, 20, 2); createWall(-35, -35, 20, 2);
    createWall(35, -35, 2, 20); createWall(-35, 35, 2, 20);
  } else if (floor === 3) {
    for(let i=0; i<4; i++) {
      const angle = (i * Math.PI / 2) + Math.PI/4;
      createWall(Math.cos(angle)*45, Math.sin(angle)*45, 15, 15);
    }
  } else if (floor === 4) {
    // 4 long walls but far from center
    createWall(50, 0, 2, 60); createWall(-50, 0, 2, 60);
    createWall(0, 50, 60, 2); createWall(0, -50, 60, 2);
  } else {
    // Final floor: small corner covers only
    createWall(60, 60, 10, 10); createWall(-60, -60, 10, 10);
    createWall(60, -60, 10, 10); createWall(-60, 60, 10, 10);
  }
}

// Layout
generateFloorLayout(1);

/* WEAPON MODEL */
const pistolGroup = new THREE.Group();
const blackMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.4, roughness: 0.4 });
const greyMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.7, roughness: 0.2 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.1 });

window.updatePistolModel = function() {
  pistolGroup.clear();
  
  if (currentWeapon.model === 'pistol') {
    // Pistol Body/Slide
    const slide = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.1, 0.45), blackMat);
    slide.position.z = -0.15;
    // Barrel inside slide
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.46), steelMat);
    barrel.rotation.x = Math.PI/2; barrel.position.z = -0.15;
    // Grip
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.25, 0.1), blackMat);
    grip.position.set(0, -0.15, 0.05); grip.rotation.x = -0.15;
    // Trigger Guard
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.12), blackMat);
    guard.position.set(0, -0.08, -0.08);
    pistolGroup.add(slide, barrel, grip, guard);

  } else if (currentWeapon.model === 'sniper') {
    // Long Barrel
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.6), steelMat);
    barrel.rotation.x = Math.PI/2; barrel.position.z = -0.7;
    // Muzzle Brake
    const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.15), greyMat);
    muzzle.position.z = -1.5;
    // Receiver
    const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.6), blackMat);
    receiver.position.z = -0.2;
    // Scope base and tube
    const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5), blackMat);
    scopeTube.rotation.x = Math.PI/2; scopeTube.position.y = 0.12; scopeTube.position.z = -0.2;
    const scopeLens = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.1), greyMat);
    scopeLens.rotation.x = Math.PI/2; scopeLens.position.y = 0.12; scopeLens.position.z = -0.45;
    // Tactical Stock
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.5), blackMat);
    stock.position.set(0, -0.05, 0.3);
    // Bolt Handle
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15), steelMat);
    bolt.position.set(0.08, 0.05, -0.1); bolt.rotation.z = Math.PI/2;
    // Vertical Handle
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.4, 0.1), blackMat);
    handle.position.set(0, -0.25, -0.1);
    pistolGroup.add(barrel, muzzle, receiver, scopeTube, scopeLens, stock, bolt, handle);

  } else if (currentWeapon.model === 'ar') {
    // Main Body
    const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.6), blackMat);
    receiver.position.z = -0.15;
    // Long Barrel
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), steelMat);
    barrel.rotation.x = Math.PI/2; barrel.position.z = -0.7;
    // Handguard
    const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.5), blackMat);
    handguard.position.z = -0.6;
    // Stock
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.5), blackMat);
    stock.position.set(0, -0.02, 0.4);
    // Magazine (Curved look)
    const mag = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.4, 0.15), greyMat);
    mag.position.set(0, -0.25, -0.15); mag.rotation.x = 0.1;
    // Iron Sights
    const frontSight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.08, 0.02), blackMat);
    frontSight.position.set(0, 0.1, -0.8);
    const rearSight = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.02), blackMat);
    rearSight.position.set(0, 0.1, -0.1);
    // Grip
    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.25, 0.09), blackMat);
    grip.position.set(0, -0.2, 0.1); grip.rotation.x = -0.15;
    pistolGroup.add(receiver, barrel, handguard, stock, mag, frontSight, rearSight, grip);
  }
}
updatePistolModel();

pistolGroup.position.set(0.4, -0.3, -0.6);
camera.add(pistolGroup);

/* AUDIO SYSTEM */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const duration = 0.3;
  const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < audioCtx.sampleRate * duration; i++) output[i] = Math.random() * 2 - 1;
  const noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass"; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
  noiseSource.start();
}

let lastPunchTime = 0;
function playPunchSound() {
  const now = Date.now(); if (now - lastPunchTime < 250) return; lastPunchTime = now;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function speak(text, pitch = 1, rate = 1) {
  const utt = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const male = voices.find(v => v.name.includes("Male") || v.name.includes("David") || v.name.includes("Alex"));
  if (male) utt.voice = male; utt.pitch = pitch; utt.rate = rate;
  window.speechSynthesis.speak(utt);
}

/* ENTITY LOGIC */
let helperCounter = 0;

function nextFloor() {
  currentFloor++;
  if (currentFloor > 5) {
    isGameOver = true;
    controls.unlock();
    document.getElementById("victory-screen").style.display = "flex";
    speak("Mission Accomplished! You cleared all floors.", 1, 1);
    return;
  }
  
  // Flash Effect
  const flash = document.getElementById("flash");
  flash.style.opacity = "1";
  setTimeout(() => flash.style.opacity = "0", 150);
  
  speak(`Floor ${currentFloor} reached!`, 1, 1.2);
  
  // Replenish grenades
  grenadeAmmo = 3;
  document.getElementById("grenade-count").innerText = grenadeAmmo;
  
  // Teleport entities back to the guaranteed clear center (0,0)
  camera.position.set(0, 1.6, 0);
  bots.forEach((bot, i) => {
    // Bots spawn slightly further out to not crowd the player
    const angle = (i / bots.length) * Math.PI * 2;
    bot.position.set(Math.cos(angle)*8, 1.2, Math.sin(angle)*8);
    bot.targetPos.set((Math.random()-0.5)*80, 1.2, (Math.random()-0.5)*80);
  });
  
  // Clear zombies and medkits
  zombies.forEach(z => scene.remove(z));
  zombies = [];
  medkits.forEach(m => scene.remove(m));
  medkits = [];
  
  // New Layout and Zombies
  generateFloorLayout(currentFloor);
  for (let i = 0; i < 15 + (currentFloor * 3); i++) spawnZombie();
  
  // Update HUD
  const floorColors = [0x3e8e41, 0x4a9b4d, 0x56a859, 0x62b565, 0x222222];
  groundMat.color.setHex(floorColors[currentFloor - 1]);
  document.getElementById("floor").innerText = currentFloor;
}

function createBloodSplatter(pos) {
  for (let i = 0; i < 15; i++) {
    const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
    const mat = new THREE.MeshBasicMaterial({ color: 0xaa0000, transparent: true, opacity: 1 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.velocity = new THREE.Vector3((Math.random()-0.5)*0.3, Math.random()*0.4, (Math.random()-0.5)*0.3);
    p.life = 1.0;
    scene.add(p);
    bloodParticles.push(p);
  }
}

function createExplosion(pos) {
  // Bigger explosion with orange/red particles
  for (let i = 0; i < 50; i++) {
    const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const mat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff4500 : 0xffa500, transparent: true, opacity: 1 });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.velocity = new THREE.Vector3((Math.random()-0.5)*0.8, Math.random()*0.8, (Math.random()-0.5)*0.8);
    p.life = 1.5;
    scene.add(p);
    bloodParticles.push(p);
  }
}

function spawnMedkit(pos) {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: medkitTexture }));
  sprite.position.copy(pos); sprite.position.y = 0.5;
  sprite.scale.set(1, 1, 1);
  scene.add(sprite); medkits.push(sprite);
}

function updateHelperHUD() {
  const container = document.getElementById("helper-hud");
  container.innerHTML = bots.map(bot => `
    <div class="helper-status">
      ${bot.name}
      <div class="helper-hp-bg"><div class="helper-hp-fill" style="width: ${(bot.hp / bot.maxHp) * 100}%"></div></div>
    </div>
  `).join('');
}

function spawnZombie() {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: zombieTexture }));
  const angle = Math.random() * Math.PI * 2; const dist = 50 + Math.random() * 30;
  sprite.position.set(camera.position.x + Math.cos(angle) * dist, 1.2, camera.position.z + Math.sin(angle) * dist);
  sprite.scale.set(2, 2, 1); sprite.hp = 3; sprite.lastHit = 0;
  scene.add(sprite); zombies.push(sprite);
}

function killZombie(z) {
  speak("ow", 0.5, 1.8); 
  createBloodSplatter(z.position);
  if (Math.random() < 0.3) spawnMedkit(z.position);
  scene.remove(z); zombies = zombies.filter(item => item !== z);
  score++; 
  document.getElementById("kills").innerText = score;
  
  if (score % 10 === 0) {
    nextFloor();
  } else {
    spawnZombie();
  }
}

function spawnBot(x, z) {
  helperCounter++;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: botTexture }));
  sprite.position.set(x, 1.2, z); sprite.scale.set(2, 2, 1); 
  sprite.lastShotTime = 0;
  sprite.hp = 100;
  sprite.maxHp = 100;
  sprite.name = "Helper " + helperCounter;
  sprite.targetPos = new THREE.Vector3(x + (Math.random()-0.5)*40, 1.2, z + (Math.random()-0.5)*40);
  scene.add(sprite); bots.push(sprite);
  updateHelperHUD();
}

for (let i = 0; i < 15; i++) spawnZombie();
spawnBot(5, 5); spawnBot(-5, -5);

/* INPUT & COMBAT */
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reload();
  if (e.code === 'KeyG') throwGrenade();
});

function throwGrenade() {
  if (grenadeAmmo <= 0) {
    speak("Out of grenades!", 1, 1);
    return;
  }
  
  const now = Date.now();
  if (now - lastGrenadeTime < 5000) {
    const wait = Math.ceil((5000 - (now - lastGrenadeTime)) / 1000);
    speak(`Wait ${wait} seconds`, 1, 1.5);
    return;
  }
  
  lastGrenadeTime = now;
  grenadeAmmo--;
  document.getElementById("grenade-count").innerText = grenadeAmmo;

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: grenadeTexture }));
  sprite.position.copy(camera.position);
  sprite.position.y -= 0.3; // Throw from roughly hand height
  sprite.scale.set(0.6, 0.6, 1);
  
  // Calculate throw direction from camera
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  
  sprite.velocity = dir.multiplyScalar(0.5);
  sprite.velocity.y += 0.2; // Arc upwards
  sprite.fuse = 3.0; // 3 seconds
  
  scene.add(sprite);
  grenades.push(sprite);
  speak("Frag out!", 1.1, 1.2);
}
window.addEventListener('keyup', (e) => keys[e.code] = false);
window.addEventListener('mousedown', () => isMouseDown = true);
window.addEventListener('mouseup', () => isMouseDown = false);

const raycaster = new THREE.Raycaster();
function reload() {
  if (isReloading || currentAmmo === currentWeapon.maxAmmo) return;
  isReloading = true;
  speak("Reloading", 1, 1.2);
  pistolGroup.rotation.x = 0.5;
  setTimeout(() => {
    currentAmmo = currentWeapon.maxAmmo;
    document.getElementById('ammo').innerText = currentAmmo;
    pistolGroup.rotation.x = 0;
    isReloading = false;
  }, 1500);
}

function shoot() {
  if (isReloading) return;
  if (currentAmmo <= 0) { reload(); return; }
  
  const now = Date.now(); if (now - lastShotTime < currentWeapon.fireRate) return; lastShotTime = now;
  
  currentAmmo--;
  document.getElementById('ammo').innerText = currentAmmo;
  playGunshot(); 
  
  pistolGroup.position.z += 0.1; pistolGroup.rotation.x -= 0.1;

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  raycaster.far = currentWeapon.range;
  const hits = raycaster.intersectObjects(zombies);
  if (hits.length > 0) { 
    hits[0].object.hp -= currentWeapon.damage; 
    if (hits[0].object.hp <= 0) killZombie(hits[0].object); 
  }
}

/* LOOP */
let lastTime = performance.now();
function animate(time) {
  requestAnimationFrame(animate);
  const dt = (time - lastTime) / 16.67; lastTime = time;

  updateDayNightCycle();
  
  // Screen Shake
  if (shakeAmount > 0) {
    camera.position.x += (Math.random() - 0.5) * shakeAmount;
    camera.position.y += (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.9; 
    if (shakeAmount < 0.01) shakeAmount = 0;
  }

  if (controls.isLocked && !isGameOver) {
    // ADS / Zoom
    const isAiming = keys['KeyQ'];
    const isSniperScope = isAiming && currentWeapon.model === 'sniper';
    document.getElementById('sniper-scope').style.display = isSniperScope ? 'block' : 'none';
    document.getElementById('crosshair').style.display = isSniperScope ? 'none' : 'block';
    pistolGroup.visible = !isSniperScope;

    const targetFOV = isAiming ? currentWeapon.zoom : 75;
    const targetGunX = isAiming ? 0 : 0.4;
    const targetGunY = isAiming ? -0.15 : -0.3;
    
    camera.fov += (targetFOV - camera.fov) * (1 - Math.pow(0.1, dt/10)); camera.updateProjectionMatrix();
    pistolGroup.position.x += (targetGunX - pistolGroup.position.x) * (1 - Math.pow(0.1, dt/10));
    pistolGroup.position.y += (targetGunY - pistolGroup.position.y) * (1 - Math.pow(0.1, dt/10));

    if (isMouseDown) shoot();
    pistolGroup.position.z += (-0.6 - pistolGroup.position.z) * 0.2 * dt;
    if (!isReloading) pistolGroup.rotation.x += (0 - pistolGroup.rotation.x) * 0.2 * dt;

    // Player Move & Collision
    const oldPos = camera.position.clone();
    const moveSpeed = 0.15 * dt;
    if (keys['KeyW']) controls.moveForward(moveSpeed); if (keys['KeyS']) controls.moveForward(-moveSpeed);
    if (keys['KeyA']) controls.moveRight(-moveSpeed); if (keys['KeyD']) controls.moveRight(moveSpeed);
    const pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(0.8, 2, 0.8));
    for (const wall of walls) { if (pBox.intersectsBox(wall)) { camera.position.copy(oldPos); break; } }
    camera.position.y = 1.6;

    // Bots
    bots.forEach(bot => {
      const distToTarget = bot.position.distanceTo(bot.targetPos);
      if (distToTarget < 2) {
        bot.targetPos.set(
          (Math.random() - 0.5) * 100,
          1.2,
          (Math.random() - 0.5) * 100
        );
      }
      const oldBotPos = bot.position.clone();
      const dirToTarget = new THREE.Vector3().subVectors(bot.targetPos, bot.position).normalize();
      bot.position.x += dirToTarget.x * 0.04 * dt;
      bot.position.z += dirToTarget.z * 0.04 * dt;
      
      // Wall Collision for Bots
      const bBox = new THREE.Box3().setFromCenterAndSize(bot.position, new THREE.Vector3(1, 2, 1));
      for (const wall of walls) {
        if (bBox.intersectsBox(wall)) {
          bot.position.copy(oldBotPos);
          bot.targetPos.set((Math.random() - 0.5) * 100, 1.2, (Math.random() - 0.5) * 100); // Change target if stuck
          break;
        }
      }

      let nearest = null; let minDist = Infinity;
      zombies.forEach(z => { const d = z.position.distanceTo(bot.position); if (d < minDist) { minDist = d; nearest = z; } });
      if (nearest && minDist < 50 && Date.now() - bot.lastShotTime > 800) {
        bot.lastShotTime = Date.now(); playGunshot();
        nearest.hp -= 1; if (nearest.hp <= 0) killZombie(nearest);
      }
    });

    // Zombies
    zombies.forEach(z => {
      let targetPos = camera.position;
      let targetDist = z.position.distanceTo(camera.position);
      let targetType = 'player';
      let targetObj = null;

      bots.forEach(bot => {
        const d = z.position.distanceTo(bot.position);
        if (d < targetDist) {
          targetDist = d;
          targetPos = bot.position;
          targetType = 'bot';
          targetObj = bot;
        }
      });

      if (targetDist > 1.5) {
        const oldZomPos = z.position.clone();
        const dir = new THREE.Vector3().subVectors(targetPos, z.position).normalize();
        z.position.x += dir.x * (0.05 + currentFloor * 0.01) * dt; 
        z.position.z += dir.z * (0.05 + currentFloor * 0.01) * dt;
        
        // Wall Collision
        const zBox = new THREE.Box3().setFromCenterAndSize(z.position, new THREE.Vector3(1, 2, 1));
        for (const wall of walls) {
          if (zBox.intersectsBox(wall)) {
            z.position.copy(oldZomPos);
            break;
          }
        }
      }
      if (targetDist < 2 && Date.now() - z.lastHit > 1000) {
        z.lastHit = Date.now(); playPunchSound();
        if (targetType === 'player') {
          health -= 1.0;
          document.getElementById("hp").style.width = (Math.max(0, health) / 8 * 200) + "px";
          if (health <= 0) {
            isGameOver = true; speak("ahhhhh!", 0.4, 1.4); controls.unlock();
            document.getElementById("death-stats").innerText = `Kills: ${score}`;
            document.getElementById("death-screen").style.display = "flex";
            zombies.forEach(zom => scene.remove(zom)); zombies = [];
            if (score > highscore) {
              console.log("The highscore was just updated!", {oldScore: highscore})
              localStorage.setItem("zombieHighScore", score);
            }
          }
        } else {
          targetObj.hp -= 10;
          updateHelperHUD();
          if (targetObj.hp <= 0) {
            scene.remove(targetObj);
            bots = bots.filter(b => b !== targetObj);
            updateHelperHUD();
          }
        }
      }
    });

    // Medkits
    medkits.forEach((med, i) => {
      med.rotation.y += 0.05 * dt;
      if (med.position.distanceTo(camera.position) < 2) {
        health = 8;
        document.getElementById("hp").style.width = "200px";
        scene.remove(med); medkits.splice(i, 1);
        speak("Healed!", 1.2, 1.2);
      }
    });

    // Blood
    bloodParticles.forEach((p, i) => {
      p.position.addScaledVector(p.velocity, dt);
      p.velocity.y -= 0.02 * dt;
      p.life -= (1 / (3 * 60)) * dt; 
      p.material.opacity = p.life;
      if (p.life <= 0) { 
        scene.remove(p); 
        p.material.dispose(); p.geometry.dispose();
        bloodParticles.splice(i, 1); 
      }
    });

    // Grenades
    grenades.forEach((g, i) => {
      g.position.addScaledVector(g.velocity, dt);
      g.velocity.y -= 0.015 * dt; // Gravity
      g.fuse -= (1 / 60) * dt;
      
      // Simple bounce off floor
      if (g.position.y < 0.3) {
        g.position.y = 0.3;
        g.velocity.y *= -0.4;
        g.velocity.x *= 0.8; g.velocity.z *= 0.8;
      }
      
      // Wall collisions
      const gBox = new THREE.Box3().setFromCenterAndSize(g.position, new THREE.Vector3(0.5, 0.5, 0.5));
      for (const wall of walls) {
        if (gBox.intersectsBox(wall)) {
          g.velocity.x *= -0.8; g.velocity.z *= -0.8;
          break;
        }
      }

      if (g.fuse <= 0) {
        // Explosion!
        createExplosion(g.position);
        playPunchSound();
        shakeAmount = 0.5; // Trigger screen shake
        
        // Damage zombies in large radius (using a copy to avoid iteration issues)
        [...zombies].forEach(z => {
          if (z.position.distanceTo(g.position) < 15) { 
            killZombie(z);
          }
        });
        
        // Damage player if too close
        const distToPlayer = camera.position.distanceTo(g.position);
        if (distToPlayer < 10) {
          health -= (10 - distToPlayer) * 0.8;
          document.getElementById("hp").style.width = (Math.max(0, health) / 8 * 200) + "px";
          if (health <= 0 && !isGameOver) {
             isGameOver = true; speak("Killed by own grenade!", 0.4, 1.4); controls.unlock();
             document.getElementById("death-stats").innerText = `Kills: ${score} | Floor: ${currentFloor}`;
             document.getElementById("death-screen").style.display = "flex";
          }
        }

        // Damage bots
        bots.forEach(bot => {
          const d = bot.position.distanceTo(g.position);
          if (d < 10) {
            bot.hp -= (10 - d) * 10;
            updateHelperHUD();
            if (bot.hp <= 0) {
              scene.remove(bot);
              bots = bots.filter(b => b !== bot);
              updateHelperHUD();
            }
          }
        });
        
        scene.remove(g);
        grenades.splice(i, 1);
      }
    });
  } else {
    const scope = document.getElementById('sniper-scope');
    if (scope) scope.style.display = 'none';
    const crosshair = document.getElementById('crosshair');
    if (crosshair) crosshair.style.display = 'block';
    if (typeof pistolGroup !== 'undefined') pistolGroup.visible = true;
  }
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
