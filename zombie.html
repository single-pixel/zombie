<!DOCTYPE html>
<html>
<head>
  <title>Zombie Arena Game</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial;
      cursor: none; /* Hide default cursor since we have a crosshair */
    }

    /* WORLD */
    #world {
      width: 2000px;
      height: 2000px;
      position: absolute;
      left: 0;
      top: 0;
      background: #3d1f14; /* Dark rust base */
      border: 8px solid #2a150e;
      box-sizing: border-box;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(139, 69, 19, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(160, 82, 45, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(0,0,0,0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px);
      background-size: 600px 600px, 600px 600px, 50px 50px, 50px 50px; /* Mottled rust with grid */
      will-change: transform;
    }

    /* CROSSHAIR */
    #crosshair {
      position: fixed;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 2000;
      transform: translate(-50%, -50%);
      will-change: left, top;
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: red;
    }

    #crosshair::before { width: 100%; height: 2px; top: 11px; left: 0; }
    #crosshair::after { width: 2px; height: 100%; top: 0; left: 11px; }

    /* PLAYER */
    .player {
      width: 44px;
      height: 44px;
      position: absolute;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999; /* Absolute top */
      pointer-events: none;
      background: rgba(0, 255, 0, 0.2); /* Faint green glow base */
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      will-change: left, top;
    }

    /* ZOMBIE */
    .zombie {
      width: 40px;
      height: 40px;
      position: absolute;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.1s;
    }

    .zombie.hit {
      transform: scale(1.3);
    }

    .bar {
      width: 24px;
      height: 4px;
      background: red;
      position: absolute;
      top: -8px;
    }

    /* BULLET */
    .bullet {
      width: 12px;
      height: 12px;
      position: absolute;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 1000;
      text-shadow: 2px 2px black;
      pointer-events: none;
    }

    #stats {
      margin-top: 10px;
      font-size: 18px;
    }

    #hpbar {
      width: 200px;
      height: 15px;
      border: 2px solid white;
      margin-top: 5px;
      background: rgba(0,0,0,0.5);
    }

    #hp {
      width: 100%;
      height: 100%;
      background: #ff3333;
      transition: width 0.2s;
    }

    /* DEATH SCREEN */
    #death-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 0, 0, 0.9);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      cursor: pointer;
    }

    #death-screen h1 {
      font-size: 100px;
      margin-bottom: 20px;
      text-shadow: 5px 5px black;
    }

    #death-screen p {
      font-size: 24px;
    }
  </style>
</head>

<body>

<div id="hud">
  ❤️ Health
  <div id="hpbar"><div id="hp"></div></div>
  <div id="stats">
    💀 Kills: <span id="kills">0</span><br>
    🌊 Wave: <span id="wave">1</span><br>
    🏆 Best: <span id="highscore">0</span>
  </div>
</div>

<div id="death-screen" onclick="location.reload()">
  <h1>YOU DIED</h1>
  <p id="death-stats"></p>
  <p>Click anywhere to restart</p>
</div>

<div id="crosshair"></div>
<div id="world"></div>

<script>
const world = document.getElementById("world");
const crosshair = document.getElementById("crosshair");

let keys = {};
let score = 0;
let wave = 1;
let highscore = localStorage.getItem("zombieHighScore") || 0;

let player = {
  x: 1000,
  y: 1000,
  vx: 0,
  vy: 0,
  hp: 8
};

document.getElementById("highscore").innerText = highscore;

/* AUDIO SYSTEM */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const duration = 0.3;
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  
  // Create white noise for the 'crack' of the gun
  for (let i = 0; i < audioCtx.sampleRate * duration; i++) {
    output[i] = Math.random() * 2 - 1;
  }
  
  const noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  
  // Filter to make it sound more like a gunshot
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + duration);

  gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

  noiseSource.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  noiseSource.start();
  noiseSource.stop(audioCtx.currentTime + duration);
}

let lastPunchTime = 0;
function playPunchSound() {
  const now = Date.now();
  if (now - lastPunchTime < 150) return; // Don't play too often
  lastPunchTime = now;

  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const duration = 0.15;
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
  oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);
  
  gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + duration);

  // Add a bit of "crunch" with noise
  const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < audioCtx.sampleRate * 0.05; i++) output[i] = Math.random() * 0.5;
  const noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  noiseSource.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noiseSource.start();
}

function speakOw() {
  const utterance = new SpeechSynthesisUtterance("ow");
  const voices = window.speechSynthesis.getVoices();
  
  // Try to find a male-sounding voice
  const maleVoice = voices.find(v => 
    v.name.includes("Male") || 
    v.name.includes("David") || 
    v.name.includes("Google US English") ||
    v.name.includes("Alex")
  );
  
  if (maleVoice) utterance.voice = maleVoice;
  utterance.pitch = 0.5; // Slightly lower for a more guttural sound
  utterance.rate = 1.8;  // Faster for a sharp cry
  window.speechSynthesis.speak(utterance);
}

function speakDeathScream() {
  const utterance = new SpeechSynthesisUtterance("ahhh!");
  const voices = window.speechSynthesis.getVoices();
  const maleVoice = voices.find(v => 
    v.name.includes("Male") || v.name.includes("David") || v.name.includes("Alex")
  );
  if (maleVoice) utterance.voice = maleVoice;
  utterance.pitch = 0.4; 
  utterance.rate = 1.4;  // Sharp shout
  window.speechSynthesis.speak(utterance);
}

let mouseX = 0;
let mouseY = 0;
let crossX = 0;
let crossY = 0;

/* INPUT */
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
window.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
window.addEventListener("resize", updateCamera);

let camX = 0;
let camY = 0;

/* PLAYER SETUP */
const playerEl = document.createElement("div");
playerEl.className = "player";
playerEl.innerText = "🤠"; // Using Cowboy emoji for better visibility
world.appendChild(playerEl);

/* ZOMBIES */
let zombies = [];

function spawnZombie() {
  const z = document.createElement("div");
  z.className = "zombie";
  z.innerText = "🧟";
  
  // Spawn away from player
  let sx, sy;
  do {
    sx = Math.random() * 1800 + 100;
    sy = Math.random() * 1800 + 100;
  } while (Math.abs(sx - player.x) < 300 && Math.abs(sy - player.y) < 300);
  
  z.x = sx;
  z.y = sy;
  z.hp = 3;

  z.bar = document.createElement("div");
  z.bar.className = "bar";
  z.appendChild(z.bar);

  world.appendChild(z);
  zombies.push(z);
}

for (let i = 0; i < 15; i++) spawnZombie();

/* PLAYER MOVEMENT */
function movePlayer(dt) {
  const accel = 1.5;
  const friction = 0.85;
  
  let dx = 0;
  let dy = 0;
  if (keys["w"]) dy -= 1;
  if (keys["s"]) dy += 1;
  if (keys["a"]) dx -= 1;
  if (keys["d"]) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const dist = Math.sqrt(dx * dx + dy * dy);
    player.vx += (dx / dist) * accel * dt;
    player.vy += (dy / dist) * accel * dt;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  player.vx *= Math.pow(friction, dt);
  player.vy *= Math.pow(friction, dt);

  // Boundary checks (accounting for 8px border and player size)
  player.x = Math.max(0, Math.min(1945, player.x));
  player.y = Math.max(0, Math.min(1945, player.y));
}

/* CAMERA SYSTEM */
function updateCamera(dt) {
  // Target screen center on player's center (22 is half of 44px player size)
  const targetX = window.innerWidth / 2 - (player.x + 22 + 8);
  const targetY = window.innerHeight / 2 - (player.y + 22 + 8);
  
  // Smoothly interpolate camera position (lerp)
  if (camX === 0 && camY === 0) {
    camX = targetX;
    camY = targetY;
  } else {
    camX += (targetX - camX) * (1 - Math.pow(0.05, dt/10));
    camY += (targetY - camY) * (1 - Math.pow(0.05, dt/10));
  }
  
  world.style.transform = `translate(${camX}px, ${camY}px)`;
}

/* CROSSHAIR SYSTEM */
function updateCrosshair(dt) {
  // Instant snap to mouse position
  crossX = mouseX;
  crossY = mouseY;
  
  crosshair.style.left = crossX + "px";
  crosshair.style.top = crossY + "px";
}

/* RENDERING */
function renderPlayer() {
  playerEl.style.left = player.x + "px";
  playerEl.style.top = player.y + "px";
}

/* ZOMBIE LOGIC */
function updateZombies(dt) {
  if (player.hp <= 0) return;
  const zombieSpeed = (0.8 + (wave * 0.1)) * dt;
  const now = Date.now();

  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    if (!z.lastHit) z.lastHit = 0;

    // Target player center (22 for player center, 20 for zombie center)
    const dx = (player.x + 22) - (z.x + 20);
    const dy = (player.y + 22) - (z.y + 20);
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 5) {
      z.x += dx / dist * zombieSpeed;
      z.y += dy / dist * zombieSpeed;
    }

    z.style.left = z.x + "px";
    z.style.top = z.y + "px";

    // Damage player: 5 hits to kill (each hit does 1.6 damage since max HP is 8)
    if (dist < 35 && now - z.lastHit > 600) {
      player.hp -= 1.6;
      z.lastHit = now;
      playPunchSound();
    }

    // HP bar update
    z.bar.style.width = (Math.max(0, z.hp) / 3 * 24) + "px";

    if (z.hp <= 0) {
      speakOw();
      z.remove();
      zombies.splice(i, 1);
      
      score++;
      document.getElementById("kills").innerText = score;
      
      if (score % 10 === 0) {
        wave++;
        document.getElementById("wave").innerText = wave;
      }
      
      spawnZombie();
    }
  }
}

/* SHOOTING SYSTEM */
document.addEventListener("mousedown", (e) => {
  if (player.hp <= 0) return;
  playGunshot();
  let hit = false;
  
  // Use current crosshair position for shooting accuracy
  const shotX = crossX - camX - 8;
  const shotY = crossY - camY - 8;

  zombies.forEach(z => {
    const dx = (z.x + 20) - shotX;
    const dy = (z.y + 20) - shotY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 35) {
      z.hp -= 1;
      hit = true;
      z.classList.add("hit");
      setTimeout(() => z.classList.remove("hit"), 50);
    }
  });

  if (!hit) {
    const b = document.createElement("div");
    b.className = "bullet";
    b.innerText = "🟡";
    b.style.left = (shotX - 5) + "px";
    b.style.top = (shotY - 5) + "px";
    world.appendChild(b);
    setTimeout(() => b.remove(), 400);
  }
});

/* STATS & HP */
function updateHP() {
  document.getElementById("hp").style.width = (Math.max(0, player.hp) / 8 * 200) + "px";

  if (player.hp <= 0 && document.getElementById("death-screen").style.display !== "flex") {
    speakDeathScream();
    
    // Clear zombies on death
    zombies.forEach(z => z.remove());
    zombies = [];
    
    if (score > highscore) {
      localStorage.setItem("zombieHighScore", score);
      highscore = score;
      document.getElementById("highscore").innerText = highscore;
    }
    
    document.getElementById("death-stats").innerText = `Kills: ${score} | Wave: ${wave}`;
    document.getElementById("death-screen").style.display = "flex";
    document.body.style.cursor = "default";
  }
}

/* GAME LOOP */
let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 16.67; // Normalize to 60fps
  lastTime = timestamp;

  movePlayer(dt);
  updateZombies(dt);
  updateCamera(dt);
  updateCrosshair(dt);
  renderPlayer();
  updateHP();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
