<!DOCTYPE html>
<html>
<head>
  <title>Zombie Arena Game</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial;
      cursor: none; /* Hide default cursor since we have a crosshair */
    }

    /* WORLD */
    #world {
      width: 2000px;
      height: 2000px;
      position: absolute;
      left: 0;
      top: 0;
      background: #222; /* Slightly darker ground */
      border: 8px solid #444;
      box-sizing: border-box;
      background-image: 
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 50px 50px; /* Grid pattern */
    }

    /* CROSSHAIR */
    #crosshair {
      position: fixed;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 2000;
      transform: translate(-50%, -50%);
    }

    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: red;
    }

    #crosshair::before { width: 100%; height: 2px; top: 11px; left: 0; }
    #crosshair::after { width: 2px; height: 100%; top: 0; left: 11px; }

    /* PLAYER */
    .player {
      width: 40px;
      height: 40px;
      position: absolute;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100; /* Ensure player is above zombies */
      pointer-events: none;
    }

    /* ZOMBIE */
    .zombie {
      width: 40px;
      height: 40px;
      position: absolute;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.1s;
    }

    .zombie.hit {
      transform: scale(1.3);
    }

    .bar {
      width: 24px;
      height: 4px;
      background: red;
      position: absolute;
      top: -8px;
    }

    /* BULLET */
    .bullet {
      width: 12px;
      height: 12px;
      position: absolute;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 1000;
      text-shadow: 2px 2px black;
      pointer-events: none;
    }

    #stats {
      margin-top: 10px;
      font-size: 18px;
    }

    #hpbar {
      width: 200px;
      height: 15px;
      border: 2px solid white;
      margin-top: 5px;
      background: rgba(0,0,0,0.5);
    }

    #hp {
      width: 100%;
      height: 100%;
      background: #ff3333;
      transition: width 0.2s;
    }

    /* DEATH SCREEN */
    #death-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 0, 0, 0.9);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      cursor: pointer;
    }

    #death-screen h1 {
      font-size: 100px;
      margin-bottom: 20px;
      text-shadow: 5px 5px black;
    }

    #death-screen p {
      font-size: 24px;
    }
  </style>
</head>

<body>

<div id="hud">
  ❤️ Health
  <div id="hpbar"><div id="hp"></div></div>
  <div id="stats">
    💀 Kills: <span id="kills">0</span><br>
    🌊 Wave: <span id="wave">1</span><br>
    🏆 Best: <span id="highscore">0</span>
  </div>
</div>

<div id="death-screen" onclick="location.reload()">
  <h1>YOU DIED</h1>
  <p id="death-stats"></p>
  <p>Click anywhere to restart</p>
</div>

<div id="crosshair"></div>
<div id="world"></div>

<script>
const world = document.getElementById("world");
const crosshair = document.getElementById("crosshair");

let keys = {};
let score = 0;
let wave = 1;
let highscore = localStorage.getItem("zombieHighScore") || 0;

let player = {
  x: 1000,
  y: 1000,
  hp: 8
};

document.getElementById("highscore").innerText = highscore;

/* INPUT */
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
window.addEventListener("mousemove", (e) => {
  crosshair.style.left = e.clientX + "px";
  crosshair.style.top = e.clientY + "px";
});
window.addEventListener("resize", updateCamera);

/* PLAYER SETUP */
const playerEl = document.createElement("div");
playerEl.className = "player";
playerEl.innerText = "🧍";
world.appendChild(playerEl);

/* ZOMBIES */
let zombies = [];

function spawnZombie() {
  const z = document.createElement("div");
  z.className = "zombie";
  z.innerText = "🧟";
  
  // Spawn away from player
  let sx, sy;
  do {
    sx = Math.random() * 1800 + 100;
    sy = Math.random() * 1800 + 100;
  } while (Math.abs(sx - player.x) < 300 && Math.abs(sy - player.y) < 300);
  
  z.x = sx;
  z.y = sy;
  z.hp = 3;

  z.bar = document.createElement("div");
  z.bar.className = "bar";
  z.appendChild(z.bar);

  world.appendChild(z);
  zombies.push(z);
}

for (let i = 0; i < 15; i++) spawnZombie();

/* PLAYER MOVEMENT */
function movePlayer() {
  const speed = 5;
  if (keys["w"]) player.y -= speed;
  if (keys["s"]) player.y += speed;
  if (keys["a"]) player.x -= speed;
  if (keys["d"]) player.x += speed;

  // Boundary checks (accounting for 8px border and player size)
  player.x = Math.max(0, Math.min(1950, player.x));
  player.y = Math.max(0, Math.min(1950, player.y));
}

/* CAMERA SYSTEM */
function updateCamera() {
  // Center screen on player's center (20 is half of 40px player size)
  const camX = window.innerWidth / 2 - (player.x + 20 + 8);
  const camY = window.innerHeight / 2 - (player.y + 20 + 8);
  world.style.transform = `translate(${camX}px, ${camY}px)`;
}

/* RENDERING */
function renderPlayer() {
  playerEl.style.left = player.x + "px";
  playerEl.style.top = player.y + "px";
}

/* ZOMBIE LOGIC */
function updateZombies() {
  const zombieSpeed = 0.2 + (wave * 0.05);

  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];

    // Target player center
    const dx = (player.x + 20) - (z.x + 20);
    const dy = (player.y + 20) - (z.y + 20);
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 5) {
      z.x += dx / dist * zombieSpeed;
      z.y += dy / dist * zombieSpeed;
    }

    z.style.left = z.x + "px";
    z.style.top = z.y + "px";

    // Damage player (reduced damage to 0.01 per frame)
    if (dist < 30) player.hp -= 0.01;

    // HP bar update
    z.bar.style.width = (Math.max(0, z.hp) / 3 * 24) + "px";

    if (z.hp <= 0) {
      z.remove();
      zombies.splice(i, 1);
      
      score++;
      document.getElementById("kills").innerText = score;
      
      if (score % 10 === 0) {
        wave++;
        document.getElementById("wave").innerText = wave;
      }
      
      spawnZombie();
    }
  }
}

/* SHOOTING SYSTEM */
document.addEventListener("mousedown", (e) => {
  if (player.hp <= 0) return;
  let hit = false;

  const camX = window.innerWidth / 2 - (player.x + 20 + 8);
  const camY = window.innerHeight / 2 - (player.y + 20 + 8);
  
  const mouseX = e.clientX - camX - 8;
  const mouseY = e.clientY - camY - 8;

  zombies.forEach(z => {
    const dx = (z.x + 20) - mouseX;
    const dy = (z.y + 20) - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < 35) {
      z.hp -= 1;
      hit = true;
      z.classList.add("hit");
      setTimeout(() => z.classList.remove("hit"), 50);
    }
  });

  if (!hit) {
    const b = document.createElement("div");
    b.className = "bullet";
    b.innerText = "🟡";
    b.style.left = (mouseX - 5) + "px";
    b.style.top = (mouseY - 5) + "px";
    world.appendChild(b);
    setTimeout(() => b.remove(), 400);
  }
});

/* STATS & HP */
function updateHP() {
  document.getElementById("hp").style.width = (Math.max(0, player.hp) / 8 * 200) + "px";

  if (player.hp <= 0) {
    if (score > highscore) {
      localStorage.setItem("zombieHighScore", score);
      highscore = score;
      document.getElementById("highscore").innerText = highscore;
    }
    
    document.getElementById("death-stats").innerText = `Kills: ${score} | Wave: ${wave}`;
    document.getElementById("death-screen").style.display = "flex";
    document.body.style.cursor = "default";
  }
}

/* GAME LOOP */
function loop() {
  movePlayer();
  updateZombies();
  updateCamera();
  renderPlayer();
  updateHP();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
